<!-- Shared output fields editor for fill_fields output action.
     Requires: _of (list of output field dicts), _action (current output_action value) -->

<!-- Output Fields editor (visible when Fill Fields is selected) -->
{% set _of = workflow.recipe.output_fields if workflow and workflow.recipe and workflow.recipe.output_fields else [] %}
<div id="output-fields-section" class="mt-3 {{ '' if _action == 'fill_fields' else 'hidden' }}">
    <label class="block text-sm text-gray-600 mb-2">Output Fields</label>
    <div id="output-fields-container"></div>
    <button type="button" onclick="addOutputField()"
        class="text-xs bg-green-50 text-green-600 px-2 py-1 rounded hover:bg-green-100 transition mt-2">
        + Add Output Field
    </button>
    <input type="hidden" name="output_fields_json" id="output-fields-json" value="[]">
</div>

<script>
(function() {
    var outputFields = {{ _of | tojson }};

    function toggleOutputFields() {
        var actionSelect = document.querySelector('select[name="output_action"]');
        var section = document.getElementById('output-fields-section');
        if (!actionSelect || !section) return;
        section.classList.toggle('hidden', actionSelect.value !== 'fill_fields');
    }

    window.addOutputField = function() {
        outputFields.push({name: '', selector: ''});
        renderOutputFields();
    };

    window.removeOutputField = function(i) {
        outputFields.splice(i, 1);
        renderOutputFields();
    };

    function updateOutputField(i, key, value) {
        outputFields[i][key] = value;
        document.getElementById('output-fields-json').value = JSON.stringify(outputFields);
    }
    window.updateOutputField = updateOutputField;

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function renderOutputFields() {
        var container = document.getElementById('output-fields-container');
        if (outputFields.length === 0) {
            container.innerHTML = '<div class="text-xs text-gray-400 py-2">No output fields defined yet.</div>';
        } else {
            container.innerHTML = outputFields.map(function(f, i) {
                return '<div class="flex gap-2 mb-2 items-center">' +
                    '<input type="text" value="' + escapeHtml(f.name) + '" onchange="updateOutputField(' + i + ', \'name\', this.value)" ' +
                        'class="flex-1 border rounded px-2 py-1.5 text-sm" placeholder="Field name">' +
                    '<input type="text" value="' + escapeHtml(f.selector) + '" onchange="updateOutputField(' + i + ', \'selector\', this.value)" ' +
                        'class="flex-1 border rounded px-2 py-1.5 text-sm font-mono" placeholder="CSS selector">' +
                    '<button type="button" onclick="removeOutputField(' + i + ')" class="text-red-400 hover:text-red-600 px-1">&times;</button>' +
                '</div>';
            }).join('');
        }
        document.getElementById('output-fields-json').value = JSON.stringify(outputFields);
    }

    function init() {
        renderOutputFields();
        toggleOutputFields();
        var actionSelect = document.querySelector('select[name="output_action"]');
        if (actionSelect) {
            actionSelect.addEventListener('change', toggleOutputFields);
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
