# Build from source (dev mode).
# To use: add ../ancroo-backend/module/compose.build.yml to COMPOSE_FILE in .env

services:
  ancroo-backend:
    image: ghcr.io/ancroo/ancroo-backend:latest
    build:
      context: ../ancroo-backend
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-dev}
        BUILD_VERSION: ${BUILD_VERSION:-dev}
